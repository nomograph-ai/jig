# gitlab.com/nomograph/jig .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline tool-rust@v4.1.7.

default:
  tags: [anvil]

include:
  - component: gitlab.com/nomograph/pipeline/tool-rust@v5.7.0
    inputs:
      binary_name: jig
      project_description: "Agent-shape testing harness: runtime-in-the-loop batteries, LLM-as-judge scoring."
      crates_publish: true
      in_kit_registry: false
  # Fail-closed automerge gate (renovate-architecture L1 verdict
  # contract): osv-verdict -> CHECK_OSV, cargo-verdict -> CHECK_CARGO
  # (builds+tests the crate; jig's tests are offline CLI-surface tests,
  # no API key needed), secret-verdict -> CHECK_SECRET, automerge-gate
  # blocks unless every required check is PRESENT and ==pass. The gate
  # job's green/red is the pipeline status Renovate reads before GitLab
  # native auto-merge.
  - component: gitlab.com/nomograph/pipeline/osv-verdict@v5.7.0
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/cargo-verdict@v5.7.0
    inputs:
      stage: verdict
  # Secret detection that BLOCKS. Replaces (does not supplement)
  # Jobs/Secret-Detection.gitlab-ci.yml: that template's analyzer shells
  # out to gitleaks with --exit-code 0, so the job exits 0 while holding
  # findings, and it ships allow_failure: true besides -- a leak could
  # never redden this pipeline. secret-verdict runs the SAME analyzer
  # image and the same curated ruleset, then parses
  # gl-secret-detection-report.json and exits nonzero when the
  # vulnerabilities array is non-empty. Identical scan surface, real
  # verdict; a missing report fails closed. This repo is PARKED behind
  # the Dependency Dashboard, which makes the gate MORE load-bearing:
  # the merges that still land here unwatched are the security ones.
  - component: gitlab.com/nomograph/pipeline/secret-verdict@v5.10.0
    inputs:
      stage: verdict
  # v5.10.0 for the secret_job needs: slot -- the v5.7.0 gate has no
  # such slot, so CHECK_SECRET would never reach it and a required
  # "secret" would fail closed forever.
  - component: gitlab.com/nomograph/pipeline/automerge-gate@v5.10.0
    inputs:
      stage: gate
      required-checks: "osv,cargo,secret"

stages: [lint, test, build, sign, publish, release, notify, verdict, gate]

# A job with no rules: inherits the legacy `only: [branches, tags]`
# default, which SKIPS merge_request_event pipelines -- check-symlinks
# carried no rules at all, so it ran on pushes to main but was silently
# absent from every MR pipeline. The MR pipeline is the head pipeline the
# automerge-gate component's only_allow_merge_if_pipeline_succeeds reads,
# so a job absent from it does not gate the merge. Same bug, same fix as
# nomograph/reference's .on-mr-and-main (also landed on nomograph/behest).
.on-mr-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

check-symlinks:
  stage: lint
  extends: .on-mr-and-main
  image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/check-symlinks.sh
